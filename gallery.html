<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090d16">
    <meta name="description" content="A photography journal by Md. Akash Mia.">
    <title>Photography | Md. Akash Mia</title>

    <!-- Tailwind ও ফন্ট সেটআপ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- গ্যালারির নিজস্ব CSS ও JavaScript -->
    <link rel="stylesheet" href="gallery_style.css">
    <script type="module" src="gallery_script.js"></script>
</head>
<body class="min-h-screen bg-[#090d16] font-sans text-slate-100 antialiased">
    <!-- Portfolio-তে ফেরার নেভিগেশন -->
    <header class="border-b border-white/10">
        <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6">
            <a href="index.html" class="text-lg font-extrabold tracking-wide text-gradient">AKASH.DEV</a>
            <a href="index.html" class="rounded-xl border border-white/10 px-4 py-2 text-sm font-semibold text-slate-300 transition hover:border-violet-400/50 hover:text-white">Back to portfolio</a>
        </nav>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-12 sm:px-6 sm:py-16">
        <!-- গ্যালারির শিরোনাম -->
        <section class="mx-auto mb-10 max-w-2xl text-center">
            <p class="text-xs font-bold uppercase tracking-[0.25em] text-violet-300">Visual journal</p>
            <h1 class="mt-3 text-4xl font-extrabold tracking-tight sm:text-6xl">Behind the <span class="text-gradient">lens</span></h1>
            <p class="mt-4 text-sm leading-6 text-slate-400 sm:text-base">Photos, places, and small stories worth remembering.</p>
        </section>

        <!-- মালিকের লগইন ও লগআউট -->
        <section class="mx-auto mb-9 max-w-xl rounded-2xl border border-white/10 bg-white/[0.03] p-5 sm:p-6" aria-labelledby="owner-heading">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <h2 id="owner-heading" class="text-sm font-bold">Gallery owner</h2>
                    <p id="auth-status" class="mt-1 text-xs text-slate-400" role="status" aria-live="polite">Visitors can browse and comment.</p>
                </div>
                <form id="sign-in-form" class="flex w-full flex-col gap-2 sm:w-auto sm:flex-row">
                    <label class="sr-only" for="owner-password">Owner password</label>
                    <input id="owner-password" type="password" required autocomplete="current-password" placeholder="Owner password" class="min-w-0 rounded-xl border border-white/10 bg-slate-950/70 px-3 py-2.5 text-sm outline-none transition placeholder:text-slate-500 focus:border-violet-400 sm:w-48">
                    <button id="sign-in-btn" type="submit" class="rounded-xl bg-violet-600 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-violet-500 disabled:cursor-wait disabled:opacity-60">Sign in</button>
                </form>
                <button id="sign-out-btn" type="button" class="hidden rounded-xl border border-white/10 px-4 py-2.5 text-sm font-semibold text-slate-300 transition hover:bg-white/5">Sign out</button>
            </div>
        </section>

        <!-- মালিকের জন্য ছবি যোগ করার ফর্ম -->
        <section id="admin-controls" class="mb-10 hidden rounded-2xl border border-violet-400/20 bg-violet-400/[0.04] p-5 sm:p-6" aria-labelledby="upload-heading">
            <h2 id="upload-heading" class="text-lg font-bold">Add a photograph</h2>
            <p class="mt-1 text-sm text-slate-400">Choose an image and add its category and story.</p>
            <form id="photo-form" class="mt-5 grid gap-4 sm:grid-cols-2">
                <div class="sm:col-span-2">
                    <label for="photo-image" class="mb-1.5 block text-xs font-semibold text-slate-300">Photo</label>
                    <input id="photo-image" type="file" accept="image/*" required class="block w-full rounded-xl border border-white/10 bg-slate-950/60 p-3 text-sm text-slate-300 file:mr-4 file:rounded-lg file:border-0 file:bg-violet-500/15 file:px-3 file:py-2 file:font-semibold file:text-violet-200">
                    <img id="image-preview" class="mt-3 hidden max-h-64 w-full rounded-xl bg-slate-950 object-contain" alt="Selected photo preview">
                </div>
                <div>
                    <label for="photo-category" class="mb-1.5 block text-xs font-semibold text-slate-300">Category</label>
                    <select id="photo-category" required class="form-control">
                        <option value="mine">My Photos</option>
                        <option value="friends">Friends</option>
                        <option value="family">Family</option>
                        <option value="nature">Nature</option>
                    </select>
                </div>
                <div>
                    <label for="photo-place" class="mb-1.5 block text-xs font-semibold text-slate-300">Place</label>
                    <input id="photo-place" type="text" maxlength="150" required placeholder="e.g. Sylhet, Bangladesh" class="form-control">
                </div>
                <div>
                    <label for="photo-date" class="mb-1.5 block text-xs font-semibold text-slate-300">Date captured</label>
                    <input id="photo-date" type="date" required class="form-control">
                </div>
                <div class="sm:col-span-2">
                    <label for="photo-details" class="mb-1.5 block text-xs font-semibold text-slate-300">Description</label>
                    <textarea id="photo-details" rows="3" maxlength="2000" placeholder="Add a little context to this moment..." class="form-control"></textarea>
                </div>
                <div class="sm:col-span-2">
                    <button id="save-photo-btn" type="submit" class="rounded-xl bg-gradient-to-r from-blue-600 to-violet-600 px-5 py-3 text-sm font-bold text-white transition hover:brightness-110 disabled:cursor-wait disabled:opacity-60">Add to gallery</button>
                </div>
            </form>
        </section>

        <!-- ক্যাটাগরি অনুযায়ী ছবি ফিল্টার -->
        <section aria-label="Photo categories">
            <div id="category-tabs" class="mb-7 flex flex-wrap justify-center gap-2" role="tablist" aria-label="Filter photos by category">
                <button class="filter-tab is-active" type="button" role="tab" aria-selected="true" data-category="all">All</button>
                <button class="filter-tab" type="button" role="tab" aria-selected="false" data-category="mine">My Photos</button>
                <button class="filter-tab" type="button" role="tab" aria-selected="false" data-category="friends">Friends</button>
                <button class="filter-tab" type="button" role="tab" aria-selected="false" data-category="family">Family</button>
                <button class="filter-tab" type="button" role="tab" aria-selected="false" data-category="nature">Nature</button>
            </div>
        </section>

        <!-- Firestore থেকে লোড হওয়া ছবির গ্রিড -->
        <div class="mb-5 text-center">
            <p id="gallery-status" class="text-sm text-slate-400" role="status" aria-live="polite">Connecting to the gallery...</p>
            <button id="retry-gallery-btn" type="button" class="mt-2 hidden rounded-lg bg-violet-600 px-4 py-2 text-xs font-bold text-white hover:bg-violet-500">Retry</button>
        </div>
        <section id="gallery-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-label="Photography gallery"></section>
    </main>
</body>
</html>
