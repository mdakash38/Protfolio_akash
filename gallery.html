<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md. Akash Mia | Photography Gallery</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gallery_style.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass-nav border-b border-slate-200 dark:border-white/10 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black text-gradient">AKASH.DEV</a>
            <a href="index.html" class="px-4 py-2 rounded-xl glass-card text-xs font-bold hover:scale-105 transition-all flex items-center gap-2">← Back to Portfolio</a>
        </div>
    </nav>

    <!-- Gallery Container -->
    <main class="max-w-7xl mx-auto py-16 px-4 sm:px-6">
        <div class="text-center max-w-2xl mx-auto mb-12" data-aos="fade-up">
            <span class="text-xs font-bold uppercase tracking-wider text-pink-500">Visual Journal</span>
            <h1 class="text-3xl sm:text-5xl font-black tracking-tight mt-2">My <span class="text-gradient">Photography</span></h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-3">Moments captured through my lens, complete with places, dates, and stories.</p>
        </div>

        <!-- Upload Box (Drag & Drop) -->
        <div class="glass-card p-8 rounded-3xl border border-dashed border-slate-300 dark:border-white/20 mb-12 text-center max-w-2xl mx-auto cursor-pointer hover:border-purple-500 transition-all shadow-xl" id="drop-zone">
            <input type="file" id="file-input" accept="image/*" class="hidden">
            <div class="space-y-3" onclick="document.getElementById('file-input').click()">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-purple-500/10 text-purple-500 flex items-center justify-center text-2xl shadow-inner">📸</div>
                <p class="text-sm font-bold">Drag & Drop your photo here, or <span class="text-blue-500 underline">Browse Image</span></p>
                <p class="text-xs text-slate-400">Supports JPG, PNG, WEBP</p>
            </div>
            
            <!-- Details Form (Appears after selecting image) -->
            <div id="form-container" class="hidden mt-6 space-y-4 text-left border-t border-slate-200 dark:border-white/10 pt-6">
                <div class="w-full h-48 rounded-2xl overflow-hidden bg-slate-800 mb-4 shadow-md relative group">
                    <img id="image-preview" class="w-full h-full object-cover">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1.5 text-slate-300">Place / Location</label>
                    <input type="text" id="photo-place" placeholder="e.g. Sylhet, Bangladesh" class="w-full bg-slate-100 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 text-white placeholder-slate-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1.5 text-slate-300">Date Captured</label>
                    <input type="date" id="photo-date" class="w-full bg-slate-100 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1.5 text-slate-300">Details / Story</label>
                    <textarea id="photo-details" rows="2" placeholder="Write a short story or details about this shot..." class="w-full bg-slate-100 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 text-white placeholder-slate-500"></textarea>
                </div>
                <button id="save-photo-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white font-bold text-sm shadow-lg shadow-purple-600/30 hover:opacity-95 transition-all">Add to Gallery</button>
            </div>
        </div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamic cards will load here -->
        </div>
    </main>

    <script src="gallery_script.js"></script>
</body>
</html>
